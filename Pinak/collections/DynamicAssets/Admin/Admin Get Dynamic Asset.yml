  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: DynamicAssetAdminTypes.AdminGetDynamicAsset
  Route: GET /dynamic-assets/admin/:id
  Access: moderator/admin
