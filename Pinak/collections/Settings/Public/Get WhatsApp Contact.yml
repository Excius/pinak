info:
  name: Get WhatsApp Contact
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/settings/whatsapp"
  headers:
    - name: Content-Type
      value: application/json
  params: []
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: SettingTypes.GetWhatsAppContact
  Returns whatsappNumber, defaultMessage, supportEmail, supportPhone for frontend direct chat integration.
