info:
  name: Get Public Settings
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/settings"
  headers:
    - name: Content-Type
      value: application/json
  params: []
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: SettingTypes.GetPublicSettings
  Optional query: ?group=general
  Returns key-value dictionary of all public settings.
