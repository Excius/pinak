info:
  name: Set Single Setting Admin
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/settings/admin/WHATSAPP_NUMBER"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "value": "+919876543210",
        "group": "contact",
        "description": "Customer support WhatsApp number for direct chat",
        "isPublic": true
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: SettingAdminTypes.SetSetting
  Upserts a single setting with full configuration.
