info:
  name: List All Settings Admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/settings/admin"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  params: []
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: SettingAdminTypes.ListSettings
  Returns all settings items with full metadata (group, description, isPublic, etc).
