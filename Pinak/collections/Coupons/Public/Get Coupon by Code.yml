info:
  name: Get Coupon by Code
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/coupons/{{code}}"
  headers:
    - name: Content-Type
      value: application/json

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: code
      value: WELCOME10

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Schema: CouponTypes.GetCoupon"
