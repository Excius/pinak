info:
  name: Validate Coupon
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/coupons/validate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "code": "WELCOME10",
        "cartTotal": 5800
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: CouponTypes.ValidateCoupon
  Requires authenticated user.
