info:
  name: Admin Validate Coupon
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/coupons/admin/validate"
  body:
    type: json
    data: |-
      {
        "code": "FLAT200",
        "cartTotal": 2500
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
