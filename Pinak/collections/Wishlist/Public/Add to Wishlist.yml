info:
  name: Add to Wishlist
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/wishlist/items"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "productVariantId": "cmnj36r8v003r2amzrpm0qvrx"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Add a product variant to the authenticated user's own wishlist.
