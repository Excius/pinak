info:
  name: Remove from Wishlist
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/wishlist/items/{{itemId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: itemId
      value: cmo01b1rt00006amz0r417bpy
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Remove an item from the authenticated user's own wishlist.
