info:
  name: Clear Wishlist
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/wishlist"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Remove all items from the authenticated user's own wishlist.
