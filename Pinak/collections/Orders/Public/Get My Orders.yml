info:
  name: Get My Orders
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/orders?page=1&limit=10"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: status
      value: CANCELLED
      type: query
      disabled: true
    - name: paymentStatus
      value: PENDING
      type: query
      disabled: true
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Schema: OrderTypes.GetOrders"
