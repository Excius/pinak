info:
  name: Health
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
