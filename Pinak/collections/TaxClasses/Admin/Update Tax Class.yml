info:
  name: Update Tax Class
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/tax-classes/{{taxClassId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "GST 12%",
        "rate": 12.0
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: taxClassId
      value: your-taxclass-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update a tax class (Moderator/Admin required).
