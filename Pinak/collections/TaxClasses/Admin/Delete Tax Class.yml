info:
  name: Delete Tax Class
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/tax-classes/{{taxClassId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: taxClassId
      value: your-taxclass-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Delete a tax class (Moderator/Admin required).
