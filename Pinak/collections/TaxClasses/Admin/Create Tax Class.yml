info:
  name: Create Tax Class
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tax-classes"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "GST 18%",
        "rate": 18.0
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Create a tax class (Moderator/Admin required).
