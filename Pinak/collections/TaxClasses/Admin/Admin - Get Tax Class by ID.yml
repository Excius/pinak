info:
  name: Admin - Get Tax Class by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tax-classes/admin/{{taxClassId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: taxClassId
      value: your-taxclass-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Get a tax class by ID with full admin payloads. Requires Moderator or Admin.
