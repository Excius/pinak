info:
  name: List Tax Classes
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tax-classes"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: List available tax classes (public, requires authentication).
