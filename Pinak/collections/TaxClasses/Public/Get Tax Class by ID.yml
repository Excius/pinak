http:
  method: GET
  url: "{{baseUrl}}/api/v1/tax-classes/{{taxClassId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: taxClassId
      value: cmnj36aet00092amzt6p7hwki
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

