info:
  name: Create Brand
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/brands/admin"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Nivea
        contentType: text/plain
      - name: slug
        type: text
        value: nivea
        contentType: text/plain
      - name: logo
        type: file
        value:
          - /path/to/logo.png
        contentType: image/png
      - name: isActive
        type: text
        value: "true"
        contentType: text/plain
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: BrandTypes.CreateBrand
  Params: none
  Query: none
  Body: name (required), slug, logo (file), isActive
