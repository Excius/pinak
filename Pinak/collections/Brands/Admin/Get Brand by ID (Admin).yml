info:
  name: Get Brand by ID (Admin)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/brands/admin/{{brandId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: brandId
      value: your-brand-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: BrandAdminTypes.GetBrandById
  Params: brandId
  Query: none
  Body: none
