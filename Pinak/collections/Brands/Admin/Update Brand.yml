info:
  name: Update Brand
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/admin/{{brandId}}"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Nivea Updated
        contentType: text/plain
      - name: slug
        type: text
        value: nivea-updated
        contentType: text/plain
      - name: logo
        type: file
        value:
          - /path/to/logo-updated.png
        contentType: image/png
      - name: isActive
        type: text
        value: "false"
        contentType: text/plain
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: brandId
      value: your-brand-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: BrandTypes.UpdateBrand
  Params: brandId
  Query: none
  Body: name, slug, logo (file), isActive
