info:
  name: List Brands
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/brands?activeOnly=true"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: activeOnly
      value: "true"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: activeOnly
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: BrandTypes.ListBrands
  Params: none
  Query: activeOnly
  Body: none
