info:
  name: List Stores
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/stores?page=1&limit=20"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: StoreTypes.ListStores
  Params: none
  Query: search, city, state, zipCode, page, limit, sortBy, sortOrder
  Body: none
