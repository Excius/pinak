info:
  name: List Stores (Admin)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/stores/admin?page=1&limit=20"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{authToken}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: StoreAdminTypes.ListStores
  Params: none
  Query: search, city, state, zipCode, isActive, includeDeleted, page, limit, sortBy, sortOrder
  Body: none
