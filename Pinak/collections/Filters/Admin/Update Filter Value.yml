info:
  name: Update Filter Value
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/filters/values/{{valueId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Crimson",
        "slug": "crimson",
        "sortOrder": 1
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: valueId
      value: your-filter-value-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update a filter value (Moderator/Admin required).
