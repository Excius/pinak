info:
  name: Delete Filter Group
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/filters/groups/{{groupId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: groupId
      value: your-group-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Delete a filter group (Moderator/Admin required).
