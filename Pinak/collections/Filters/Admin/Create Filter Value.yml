info:
  name: Create Filter Value
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/filters/groups/{{groupId}}/values"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Red",
        "slug": "red",
        "sortOrder": 0
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: groupId
      value: your-group-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Create a filter value (Moderator/Admin required).
