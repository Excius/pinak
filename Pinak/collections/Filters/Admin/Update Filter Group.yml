info:
  name: Update Filter Group
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/filters/groups/{{groupId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Color V2",
        "slug": "color-v2",
        "sortOrder": 1,
        "isActive": true
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: groupId
      value: your-group-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update a filter group (Moderator/Admin required).
