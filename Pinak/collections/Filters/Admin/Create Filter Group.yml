info:
  name: Create Filter Group
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/filters/groups"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Color",
        "slug": "color",
        "sortOrder": 0,
        "isActive": true
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Create a filter group (Moderator/Admin required).
