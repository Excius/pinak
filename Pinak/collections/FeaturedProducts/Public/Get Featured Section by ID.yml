info:
  name: Get Featured Section by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/featured-sections/{{sectionId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: sectionId
      value: cmnj36uiv004f2amzrsvnxnh9
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: FeaturedSectionTypes.GetFeaturedSectionById
  Route: /featured-sections/:id
  Access: authenticated user
