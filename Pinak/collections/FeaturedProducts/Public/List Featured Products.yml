info:
  name: List Featured Sections
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/featured-sections"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: FeaturedSectionTypes.ListFeaturedSections
  Route: /featured-sections
  Access: authenticated user
