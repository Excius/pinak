info:
  name: Admin List Featured Sections
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/featured-sections/admin/all"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: FeaturedSectionTypes.AdminListFeaturedSections
  Route: /featured-sections/admin/all
  Access: moderator/admin
