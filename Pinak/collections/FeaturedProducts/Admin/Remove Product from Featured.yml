info:
  name: Remove Product from Featured
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/products/admin/featured/{{featuredProductId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: featuredProductId
      value: your-featured-product-id-here
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.RemoveProductFromFeatured
  Route: /products/admin/featured/:featuredProductId
  Params: featuredProductId
  Query: none
  Body: none
