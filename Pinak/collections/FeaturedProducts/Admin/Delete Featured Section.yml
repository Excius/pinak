info:
  name: Delete Featured Section
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/featured-sections/admin/{{sectionId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: sectionId
      value: your-featured-section-id-here
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: FeaturedSectionTypes.DeleteFeaturedSection
  Route: /featured-sections/admin/:id
  Access: moderator/admin
