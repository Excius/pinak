info:
  name: Add Featured Section Image
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/featured-sections/admin/{{sectionId}}/images"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value:
          - /path/to/banner.jpg
        contentType: image/jpeg
      - name: altText
        type: text
        value: Featured section banner image
        contentType: text/plain
      - name: isPrimary
        type: text
        value: "false"
        contentType: text/plain
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: sectionId
      value: cmtjvfb1z004j0zmzbdxjeyn5
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: FeaturedSectionAdminTypes.AddFeaturedSectionImage
  Params: sectionId
  Query: none
  Body: image (file, required), altText (optional), isPrimary (optional boolean string)
