info:
  name: Set Primary Featured Section Image
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/featured-sections/admin/images/{{imageId}}/primary"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: imageId
      value: cmtjwhotu004ls3mzbu58uamt
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Set an image as primary for its featured section (admin only).
