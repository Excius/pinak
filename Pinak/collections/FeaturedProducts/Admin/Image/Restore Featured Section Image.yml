info:
  name: Restore Featured Section Image
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/featured-sections/admin/images/{{id}}/restore"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: id
      value: cmtjwhotu004ls3mzbu58uamt
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Restore a soft-deleted featured section image (admin only).
