info:
  name: Admin Get Featured Section Images
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/featured-sections/admin/{{sectionId}}/images"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: sectionId
      value: cmtjwhota004gs3mzim9s1mos
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: FeaturedSectionAdminTypes.AdminGetFeaturedSectionImages
  Route: GET /featured-sections/admin/:sectionId/images
  Access: moderator/admin
