info:
  name: Update Weight Class
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/weight-classes/{{weightClassId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Gram Updated",
        "unit": "g"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: weightClassId
      value: your-weight-class-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update a weight class (Moderator/Admin required).
