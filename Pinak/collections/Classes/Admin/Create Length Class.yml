info:
  name: Create Length Class
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/length-classes"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Centimeter",
        "unit": "cm"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Create a length class (Moderator/Admin required).
