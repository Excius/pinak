info:
  name: Update Length Class
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/length-classes/{{lengthClassId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Centimeter Updated",
        "unit": "cm"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: lengthClassId
      value: your-length-class-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update a length class (Moderator/Admin required).
