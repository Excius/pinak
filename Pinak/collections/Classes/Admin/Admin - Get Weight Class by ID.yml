info:
  name: Admin - Get Weight Class by ID
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/weight-classes/{{weightClassId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: weightClassId
      value: your-weight-class-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Get a weight class by ID with full admin payloads. Requires Moderator or Admin.
