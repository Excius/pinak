info:
  name: Delete Weight Class
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/weight-classes/{{weightClassId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: weightClassId
      value: your-weight-class-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Delete a weight class (Moderator/Admin required).
