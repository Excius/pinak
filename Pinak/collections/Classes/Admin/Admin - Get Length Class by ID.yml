info:
  name: Admin - Get Length Class by ID
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/length-classes/{{lengthClassId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: lengthClassId
      value: your-length-class-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Get a length class by ID with full admin payloads. Requires Moderator or Admin.
