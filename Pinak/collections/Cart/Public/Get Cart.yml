info:
  name: Get Cart
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cart"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: CartTypes.GetCart
  Requires authenticated user.
