info:
  name: Add Item to Cart
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/cart/items"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "productVariantId": "cmnj36trl00412amzrokgnkoy",
        "quantity": 1
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: CartTypes.AddToCart
  Provide exactly one: productVariantId or comboKitId.
