info:
  name: List Pages
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/pages"
  headers:
    - name: Content-Type
      value: application/json
  params: []
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: PageTypes.ListPages
  Returns active, non-deleted static pages summary (id, slug, title, metaTitle, metaDescription, updatedAt).
