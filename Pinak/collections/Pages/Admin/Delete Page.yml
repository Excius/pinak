info:
  name: Delete Page
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/pages/admin/{{pageId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  params: []
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: PageAdminTypes.DeletePage
  Soft deletes the page. Requires Moderator or Admin role.
