info:
  name: List Pages Admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/pages/admin?page=1&limit=20"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: PageAdminTypes.ListPages
  Requires Moderator or Admin role.
