info:
  name: Restore Page
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/pages/admin/{{pageId}}/restore"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  params: []
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: PageAdminTypes.RestorePage
  Restores a soft-deleted page. Requires Moderator or Admin role.
