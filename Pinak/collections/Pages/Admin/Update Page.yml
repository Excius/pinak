info:
  name: Update Page
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/pages/admin/{{pageId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "title": "Privacy Policy (Updated)",
        "content": "# Privacy Policy\n\nUpdated policy terms...",
        "isActive": true
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: PageAdminTypes.UpdatePage
  Requires Moderator or Admin role.
