info:
  name: Admin - Get Option by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/options/admin/{{optionId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: optionId
      value: your-option-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Get an option by ID with full admin payloads. Requires Moderator or Admin.
