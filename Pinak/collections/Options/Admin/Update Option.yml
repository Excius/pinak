info:
  name: Update Option
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/options/{{optionId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Volume (ml)",
        "sortOrder": 1
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: optionId
      value: your-option-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update an option group (Moderator/Admin required).
