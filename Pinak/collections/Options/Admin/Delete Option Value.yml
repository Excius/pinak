info:
  name: Delete Option Value
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/options/values/{{valueId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: valueId
      value: your-option-value-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Delete an option value (Moderator/Admin required).
