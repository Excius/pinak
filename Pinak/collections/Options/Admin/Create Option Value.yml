info:
  name: Create Option Value
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/options/{{optionId}}/values"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "value": "30ml",
        "sortOrder": 0
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: optionId
      value: your-option-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Create a new option value (Moderator/Admin required).
