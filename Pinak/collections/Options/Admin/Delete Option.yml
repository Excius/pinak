info:
  name: Delete Option
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/options/{{optionId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: optionId
      value: your-option-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Delete an option group (Moderator/Admin required).
