info:
  name: List Options
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/options"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: List option definitions (public).
