info:
  name: Get BestSeller Analytics
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/admin/bestsellers/analytics?timeframe=all_time"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: timeframe
      value: all_time
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: BestSellerTypes.GetBestSellerAnalytics
  Params: none
  Query: timeframe
  Body: none
