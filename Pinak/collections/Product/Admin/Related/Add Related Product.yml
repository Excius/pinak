info:
  name: Add Related Product
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/products/admin/{{productId}}/related"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "relatedProductId": "your-related-product-id-here",
        "sortOrder": 1
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: productId
      value: your-product-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: RelatedProductTypes.AddRelatedProduct
  Params: productId
  Query: none
  Body: relatedProductId, sortOrder(optional)
