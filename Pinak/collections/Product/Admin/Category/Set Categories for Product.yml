info:
  name: Set Categories for Product
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/products/admin/{{productId}}/categories"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "categoryIds": ["your-category-id-here"]
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: productId
      value: your-product-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductCategoryTypes.SetCategoriesForProduct
  Params: productId
  Query: none
  Body: categoryIds[] (min 1)
