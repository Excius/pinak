info:
  name: Remove Product from Category
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/products/admin/{{productId}}/categories/{{categoryId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: productId
      value: your-product-id-here
    - name: categoryId
      value: your-category-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductCategoryTypes.RemoveProductFromCategory
  Params: productId, categoryId
  Query: none
  Body: {}
