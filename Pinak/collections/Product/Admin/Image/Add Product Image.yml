info:
  name: Add Product Image
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/products/admin/variants/{{variantId}}/images"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value:
          - /home/excius/Downloads/profile.jpg
        contentType: image/jpeg
      - name: altText
        type: text
        value: Test Image
        contentType: text/plain
      - name: isPrimary
        type: text
        value: "false"
        contentType: text/plain
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: variantId
      value: cmobesyal00430emzj2a7mk4g

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.AddProductImage
  Params: variantId
  Query: none
  Body: url(required), altText
