info:
  name: Admin Get Variant Images
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/admin/variants/{{variantId}}/images"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: variantId
      value: your-variant-id-here
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.AdminGetProductVariantImages
  Route: GET /products/admin/variants/:variantId/images
  Access: moderator/admin
