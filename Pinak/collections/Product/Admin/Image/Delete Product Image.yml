info:
  name: Delete Product Image
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/products/admin/images/{{id}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: id
      value: your-image-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Delete a product variant image (deletes image from S3 and database).
  Route uses ProductTypes.DeleteImage schema
  Params: id
  Query: none
  Body: none
