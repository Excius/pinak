info:
  name: Admin - Get Products by Status
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/admin/status/{{status}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: sortBy
      value: createdAt
      type: query
    - name: sortOrder
      value: desc
      type: query
    - name: search
      value: serum
      type: query
    - name: brand
      value: your-brand
      type: query
    - name: isActive
      value: "true"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: status
      value: ACTIVE

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Route uses :status path + ProductTypes.GetAllProductsAdmin query schema
  Params: status
  Query: page, limit, sortBy, sortOrder, search, brand, isActive
  Body: none
