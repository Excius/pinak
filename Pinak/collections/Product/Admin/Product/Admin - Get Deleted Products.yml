info:
  name: Admin - Get Deleted Products
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/admin/deleted"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: sortBy
      value: createdAt
      type: query
    - name: sortOrder
      value: desc
      type: query
    - name: search
      value: serum
      type: query
    - name: brand
      value: your-brand
      type: query
    - name: isActive
      value: "false"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.GetAllProductsAdmin
  Params: none
  Query: page, limit, sortBy, sortOrder, search, brand, isActive
  Body: none
