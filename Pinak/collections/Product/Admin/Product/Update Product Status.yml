info:
  name: Update Product Status
  type: http
  seq: 16

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/products/admin/{{id}}/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isActive": true
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: id
      value: cmtdbnbmb00447qmz0j1tzgmf

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.UpdateProductStatus
  Params: id
  Query: none
  Body: isActive
