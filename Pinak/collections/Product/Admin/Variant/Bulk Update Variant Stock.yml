info:
  name: Bulk Update Variant Stock
  type: http
  seq: 25

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/products/admin/variants/stock/bulk"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      [
        {
          "variantId": "variant-id-1",
          "newStock": 50
        },
        {
          "variantId": "variant-id-2",
          "newStock": 20
        }
      ]
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.BulkUpdateVariantStock
  Params: none
  Query: none
  Body: array<{ variantId, newStock }>
