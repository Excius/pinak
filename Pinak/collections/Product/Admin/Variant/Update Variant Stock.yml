info:
  name: Update Variant Stock
  type: http
  seq: 24

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/products/admin/variants/{{variantId}}/stock"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "newStock": 100
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: variantId
      value: your-variant-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.UpdateVariantStock
  Params: variantId
  Query: none
  Body: newStock
