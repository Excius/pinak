info:
  name: Restore Product Variant
  type: http
  seq: 23

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/products/admin/variants/{{id}}/restore"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: id
      value: your-variant-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.RestoreProductVariant
  Params: id
  Query: none
  Body: {}
