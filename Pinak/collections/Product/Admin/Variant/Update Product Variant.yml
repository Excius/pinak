info:
  name: Update Product Variant
  type: http
  seq: 21

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/products/admin/variants/{{id}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "sku": "SERUM-30ML-V2",
        "ean": "1234567890124",
        "price": 849,
        "comparePrice": 999,
        "stock": 30,
        "weightGrams": 125,
        "weightClassId": "your-weight-class-id",
        "tags": ["30ml", "updated"],
        "optionValueIds": ["option-value-id-1"],
        "isActive": true
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: id
      value: your-variant-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.UpdateProductVariant
  Params: id
  Query: none
  Body: optional variant fields
