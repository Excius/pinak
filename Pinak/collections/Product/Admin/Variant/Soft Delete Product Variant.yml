info:
  name: Soft Delete Product Variant
  type: http
  seq: 22

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/products/admin/variants/{{id}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here
    - name: id
      value: your-variant-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.SoftDeleteProductVariant
  Params: id
  Query: none
  Body: {}
