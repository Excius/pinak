info:
  name: Get Out of Stock Products
  type: http
  seq: 34

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/admin/stock/out-of-stock"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-moderator-or-admin-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Route: /products/admin/stock/out-of-stock
  Params: none
  Query: none
  Body: none
