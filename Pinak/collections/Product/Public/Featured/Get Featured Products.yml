info:
  name: Get Featured Products
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/featured"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: sectionId
      value: optional-section-id
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.GetFeaturedProducts
  Params: none
  Query: page, limit, sectionId
  Body: none
