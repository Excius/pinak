info:
  name: List Categories for Product
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/{{productId}}/categories"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: productId
      value: cmnessn05003v9ymzq4scgw0w

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductCategoryTypes.ListCategoriesForProduct
  Params: productId
  Query: none
  Body: none
