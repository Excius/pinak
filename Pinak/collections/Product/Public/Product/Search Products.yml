info:
  name: Search Products
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/search?q=Vitamin&page=1&limit=10"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: q
      value: Vitamin
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.SearchProducts
  Params: none
  Query: q, page, limit
  Body: none
