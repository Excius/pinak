info:
  name: Get Product by Slug
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/slug/{{slug}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: slug
      value: vitamin-c-serum

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.GetProductBySlug
  Params: slug
  Query: none
  Body: none
