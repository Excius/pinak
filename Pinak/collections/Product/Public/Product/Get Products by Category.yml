info:
  name: Get Products by Category
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/category/{{categoryId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: sortBy
      value: createdAt
      type: query
    - name: sortOrder
      value: desc
      type: query
    - name: brand
      value: your-brand-slug-or-name
      type: query
    - name: inStock
      value: "true"
      type: query
    - name: filterValueIds
      value: value-id-1,value-id-2
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: categoryId
      value: cmness8e6001k9ymz2yjjye6r

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ProductTypes.GetProductsWithCategory
  Params: categoryId
  Query: page, limit, sortBy, sortOrder, brand, inStock, filterValueIds
  Body: none
