info:
  name: List Related Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/{{productId}}/related"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: productId
      value: cmnessas3002e9ymzh21bwrrf

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: RelatedProductTypes.ListRelated
  Params: productId
  Query: none
  Body: none
