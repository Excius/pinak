info:
  name: GoogleOAuth Mobile Callback
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/google/mobile/callback"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
