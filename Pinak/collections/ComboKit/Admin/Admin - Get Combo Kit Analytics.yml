info:
  name: Admin - Get Combo Kit Analytics
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/api/v1/combo-kits/admin/{{id}}/analytics"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: id
      value: combo-kit-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Get combo analytics (views, purchases, order/cart aggregates). Requires Moderator or Admin.
