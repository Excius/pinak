info:
  name: Restore Combo Kit
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/combo-kits/{{id}}/restore"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: id
      value: combo-kit-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Restore a soft-deleted combo kit. Requires Moderator or Admin.
