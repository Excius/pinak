info:
  name: Admin - Get Deleted Combo Kits
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/v1/combo-kits/admin/deleted?page=1&limit=10"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: List only soft-deleted combo kits. Requires Moderator or Admin.
