info:
  name: Hard Delete Combo Kit (Admin only)
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/combo-kits/admin/{{id}}/hard"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: id
      value: combo-kit-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Permanently delete a combo kit (admin only). Make sure there are no dependent resources (carts/orders).
