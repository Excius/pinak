info:
  name: Update Combo Kit Status
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/combo-kits/{{id}}/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isActive": true
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: id
      value: combo-kit-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update combo kit active status. Requires Moderator or Admin.
