info:
  name: Update Combo Kit
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/combo-kits/admin/{{id}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Weekend Essentials Pack — Updated",
        "description": "Updated description",
        "audience": "women",
        "metaTitle": "Updated Weekend Essentials Pack | Pinak",
        "metaDescription": "Updated SEO description",
        "metaKeywords": "updated, combo, weekend",
        "seoKeyword": "weekend-essentials-pack-updated",
        "imageUrl": "https://example.com/images/combo-weekend-essentials-pack-updated.jpg",
        "pricingStrategy": "CALCULATED",
        "discountType": "FIXED_AMOUNT",
        "discountValue": 250,
        "tags": ["weekend", "updated"],
        "sortOrder": 2,
        "price": 4599,
        "isActive": true,
        "items": [
          {
            "productVariantId": "variant-id-1",
            "quantity": 1,
            "sortOrder": 0,
            "originalPrice": 2999,
            "discountedPrice": 2800,
            "isRequired": true
          },
          {
            "productVariantId": "variant-id-4",
            "quantity": 1,
            "sortOrder": 1,
            "originalPrice": 1999,
            "discountedPrice": 1800,
            "isRequired": false
          }
        ]
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: id
      value: combo-kit-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update combo kit fields including pricing, metadata and optional full item replacement.
