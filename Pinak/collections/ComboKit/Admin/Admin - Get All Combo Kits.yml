info:
  name: Admin - Get All Combo Kits
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/api/v1/combo-kits/admin/all?page=1&limit=10&sortBy=createdAt&sortOrder=desc"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: sortBy
      value: createdAt
      type: query
    - name: sortOrder
      value: desc
      type: query
    - name: search
      value: starter
      type: query
      disabled: true
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: List all combo kits including deleted records. Requires Moderator or Admin.
