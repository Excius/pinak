info:
  name: Add Combo Kit Item
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/combo-kits/admin/{{comboKitId}}/items"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "productVariantId": "variant-id-3",
        "quantity": 1,
        "sortOrder": 2,
        "originalPrice": 2200,
        "discountedPrice": 1999,
        "isRequired": true
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: comboKitId
      value: combo-kit-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Add a product variant to an existing combo kit. Requires Moderator or Admin.
  Supports quantity, sort order, pricing snapshot and required flag.
