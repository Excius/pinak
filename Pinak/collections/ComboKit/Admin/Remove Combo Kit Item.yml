info:
  name: Remove Combo Kit Item
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/combo-kits/{{comboKitId}}/items/{{itemId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: comboKitId
      value: combo-kit-id-here
    - name: itemId
      value: combo-kit-item-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Remove an item from a combo kit. Requires Moderator or Admin.
