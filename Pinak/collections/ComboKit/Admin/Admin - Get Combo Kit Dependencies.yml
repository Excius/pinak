info:
  name: Admin - Get Combo Kit Dependencies
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/api/v1/combo-kits/admin/{{id}}/dependencies"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here
    - name: id
      value: combo-kit-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Get combo dependency counts (carts/orders) before hard delete. Requires Moderator or Admin.
