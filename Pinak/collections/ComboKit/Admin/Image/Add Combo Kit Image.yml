info:
  name: Add Combo Kit Image
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/combo-kits/admin/{{comboKitId}}/images"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value:
          - /path/to/combo-image.jpg
        contentType: image/jpeg
      - name: altText
        type: text
        value: Sample combo kit image
        contentType: text/plain
      - name: isPrimary
        type: text
        value: "false"
        contentType: text/plain
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: comboKitId
      value: your-combo-kit-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Schema: ComboKitAdminTypes.AddComboKitImage
  Params: comboKitId
  Query: none
  Body: image (file, required), altText (optional), isPrimary (optional boolean string)
