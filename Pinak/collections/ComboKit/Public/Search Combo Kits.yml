info:
  name: Search Combo Kits
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/combo-kits/search?q=glow&page=1&limit=10&isActive=true"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: q
      value: glow
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: isActive
      value: "true"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Search combo kits using query term `q`.
