info:
  name: Get Combo Kit by Slug
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/combo-kits/slug/{{slug}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: slug
      value: lash-define-duo

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Get a combo kit by its slug (public).
  Replace `{{slug}}` with the combo kit slug to fetch.
