info:
  name: Update Category
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/categories/admin/{{categoryId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Sample Category Updated",
        "slug": "sample-category-updated",
        "parentId": null
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: categoryId
      value: your-category-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Update category (Moderator/Admin required).
