info:
  name: Delete Category Image
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/categories/admin/images/{{id}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: id
      value: your-image-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Delete a category image (deletes image from S3 and database).
  Schema: CategoryAdminTypes.DeleteCategoryImage
  Params: id
  Query: none
  Body: none
