info:
  name: Add Category Image
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/categories/admin/{{categoryId}}/images"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "url": "https://example.com/images/categories/sample.jpg",
        "altText": "Sample category image",
        "isPrimary": false
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: categoryId
      value: your-category-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Add an image to a category (admin only). Body: `url`, optional `altText`, optional `isPrimary`."
