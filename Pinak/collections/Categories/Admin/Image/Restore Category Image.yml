info:
  name: Restore Category Image
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/categories/admin/images/{{id}}/restore"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: id
      value: your-image-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Restore a soft-deleted category image (admin only).
