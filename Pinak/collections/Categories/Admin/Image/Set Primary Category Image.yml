info:
  name: Set Primary Category Image
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/categories/admin/images/{{imageId}}/primary"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: imageId
      value: your-image-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Set an image as primary for its category (admin only).
