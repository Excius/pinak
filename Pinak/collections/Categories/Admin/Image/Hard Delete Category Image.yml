info:
  name: Hard Delete Category Image
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/categories/admin/images/{{id}}/hard"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: id
      value: your-image-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Permanently delete a category image (admin only).
