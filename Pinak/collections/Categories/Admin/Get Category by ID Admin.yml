info:
  name: Get Category by ID (Admin)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/categories/admin/{{categoryId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: categoryId
      value: your-category-id-here
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Fetch a category by its ID (admin — full content).

  Path Parameters:
  - categoryId: Category ID (required)
