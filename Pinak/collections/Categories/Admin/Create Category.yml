info:
  name: Create Category
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/categories/admin"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Sample Category",
        "slug": "sample-category",
        "parentId": null
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Create a category (Moderator/Admin required).
