info:
  name: Get Category by Slug
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/categories/slug/{{slug}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: slug
      value: foundation
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Fetch a category by its SEO slug.

  Path Parameters:
  - slug: category slug (required)
