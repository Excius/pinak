info:
  name: List Top Categories
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/categories/top"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: authToken
      value: your-jwt-token-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: List categories (public).
